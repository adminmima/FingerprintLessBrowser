name: Inspect Tor APK Structure

on:
  workflow_dispatch:
    inputs:
      tor_version:
        description: 'Tor Browser version'
        required: true
        default: '16.0a13'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget

      - name: Download APK
        run: |
          V="${{ github.event.inputs.tor_version }}"
          BASE="https://dist.torproject.org/torbrowser/${V}"
          FILE="tor-browser-android-aarch64-${V}.apk"
          echo "URL: ${BASE}/${FILE}"
          wget -q --show-progress -O tor.apk "${BASE}/${FILE}"
          ls -lh tor.apk

      - name: List full APK contents
        run: |
          echo "========== FULL APK LISTING =========="
          unzip -l tor.apk
          echo ""
          echo "========== omni.ja matches =========="
          unzip -l tor.apk | grep -i "omni" || echo "none"
          echo ""
          echo "========== torrc matches =========="
          unzip -l tor.apk | grep -i "torrc" || echo "none"
          echo ""
          echo "========== prefs matches =========="
          unzip -l tor.apk | grep -iE "pref\.js|prefs|defaults/pref" || echo "none"
          echo ""
          echo "========== assets/ top level =========="
          unzip -l tor.apk | grep "assets/" | head -60

      - name: If omni.ja exists, list its contents
        run: |
          OMNI=$(unzip -l tor.apk | awk '/omni\.ja/{print $NF}' | head -1)
          echo "omni.ja path in APK: [$OMNI]"
          if [ -n "$OMNI" ]; then
            unzip -o tor.apk "$OMNI"
            OMNI_FILE=$(find . -name "omni.ja" -type f | head -1)
            echo "Extracted to: $OMNI_FILE"
            echo "========== omni.ja CONTENTS (filtered) =========="
            unzip -l "$OMNI_FILE" | grep -iE "pref|tor|proxy" | head -80
            echo ""
            echo "========== omni.ja FULL top level =========="
            unzip -l "$OMNI_FILE" | head -60
          fi

      - name: Upload listing
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspection-${{ github.event.inputs.tor_version }}
          path: |
            tor.apk
