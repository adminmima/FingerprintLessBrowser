# .github/workflows/archive-all-logs.yml
name: 归档所有历史日志

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: 下载并归档所有日志
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          DATE="2026-10-07"
          ARCHIVE_DIR="归档-${DATE}"
          mkdir -p "${ARCHIVE_DIR}"

          echo "=== 获取工作流列表 ==="
          gh workflow list --repo "$REPO" --json id,name > "${ARCHIVE_DIR}/工作流清单.json"
          
          cat > "${ARCHIVE_DIR}/总览说明.md" << EOF
          # 工作流历史归档总览
          
          - 归档日期：${DATE}
          - 仓库：${REPO}
          
          ## 工作流列表
          EOF

          for wf_id in $(jq -r '.[].id' "${ARCHIVE_DIR}/工作流清单.json"); do
            wf_name=$(jq -r ".[] | select(.id==${wf_id}) | .name" "${ARCHIVE_DIR}/工作流清单.json")
            wf_safe=$(echo "$wf_name" | sed 's/[^a-zA-Z0-9]/_/g')
            
            echo "处理：${wf_name}"
            echo "- **${wf_name}**" >> "${ARCHIVE_DIR}/总览说明.md"
            
            # 获取运行
            runs_file="${ARCHIVE_DIR}/${wf_safe}-运行记录.json"
            gh run list --repo "$REPO" --workflow="$wf_id" -L 100 \
              --json databaseId,status,conclusion,createdAt,headBranch,event,url \
              > "$runs_file" 2>&1 || echo "[]" > "$runs_file"
            
            run_count=$(jq 'length' "$runs_file")
            echo "  运行次数：${run_count}" >> "${ARCHIVE_DIR}/总览说明.md"
            
            # 下载日志
            logs_dir="${ARCHIVE_DIR}/${wf_safe}-原始日志"
            mkdir -p "$logs_dir"
            
            for run_id in $(jq -r '.[].databaseId' "$runs_file" 2>/dev/null); do
              echo "  下载运行 ${run_id}..."
              gh run view --repo "$REPO" "$run_id" --log > "${logs_dir}/运行${run_id}.log" 2>&1 || {
                echo "失败: ${run_id}" >> "${logs_dir}/下载失败记录.txt"
                continue
              }
              
              # 压缩大文件
              if [ $(stat -c%s "${logs_dir}/运行${run_id}.log" 2>/dev/null) -gt 1048576 ]; then
                gzip "${logs_dir}/运行${run_id}.log"
              fi
            done
            
            # 生成摘要
            cat > "${ARCHIVE_DIR}/${wf_safe}-摘要.md" << EOF
          # ${wf_name} - 运行摘要
          
          | 运行ID | 状态 | 结果 | 分支 | 事件 | 时间 | 链接 |
          |--------|------|------|------|------|------|------|
          EOF
            jq -r '.[] | "|  $.databaseId) |  $.status) |  $.conclusion // "无") |  $.headBranch) |  $.event) |  $.createdAt) | [查看]( $.url)) |"' "$runs_file" >> "${ARCHIVE_DIR}/${wf_safe}-摘要.md" 2>/dev/null
          done

      - name: 打包上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 归档日志-${DATE}
          path: 归档-${DATE}/
          retention-days: 30
