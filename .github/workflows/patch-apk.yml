name: Patch Tor Browser APK

on:
  workflow_dispatch:
    inputs:
      tor_version:
        description: 'Tor Browser version'
        required: true
        default: '16.0a13'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip wget xz-utils openjdk-17-jre-headless
          wget -q -O uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Download APK
        run: |
          V="${{ inputs.tor_version }}"
          URL="https://dist.torproject.org/torbrowser/${V}/tor-browser-android-aarch64-${V}.apk"
          echo "Downloading $URL"
          wget -q --show-progress -O tor-orig.apk "$URL"
          ls -lh tor-orig.apk

      - name: Extract omni.ja.xz
        run: |
          mkdir -p staging && cd staging
          unzip -o ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          ls -lh assets/
          echo "=== sha256 file format ==="
          cat assets/omni.ja.sha256
          echo ""

      - name: Decompress omni.ja and inspect prefs
        run: |
          cd staging
          cp assets/omni.ja.xz omni.ja.xz
          xz -d omni.ja.xz
          ls -lh omni.ja
          mkdir omni_content && cd omni_content
          unzip -q ../omni.ja
          echo "=== defaults/pref/ ==="
          ls -la defaults/pref/ 2>/dev/null || echo "no defaults/pref dir"
          echo "=== 现有 pref 文件 ==="
          find . -name "*.js" -path "*pref*" 2>/dev/null | head -30

      - name: Add our prefs file
        run: |
          cd staging/omni_content
          mkdir -p defaults/pref
          cat > defaults/pref/zzz-fingerprintless.js << 'EOF'
          // FingerprintLessBrowser - 移除 Tor 网络，保留反指纹
          pref("network.proxy.type", 0);
          pref("network.proxy.socks", "");
          pref("network.proxy.socks_port", 0);
          pref("network.proxy.socks_remote_dns", false);
          pref("extensions.torlauncher.start_tor", false);
          pref("extensions.torlauncher.quickstart", false);
          pref("extensions.torlauncher.prompt_at_startup", false);
          pref("extensions.torbutton.startup", false);
          EOF
          ls -la defaults/pref/

      - name: Repack omni.ja and update sha256
        run: |
          cd staging/omni_content
          zip -q -r -0 ../omni-new.ja ./*
          cd ..
          xz -9 -k -f omni-new.ja
          ls -lh omni-new.ja.xz

          NEW_SHA=$(sha256sum omni-new.ja.xz | awk '{print $1}')
          echo "New SHA256: $NEW_SHA"

          # 匹配原 sha256 文件格式
          ORIG=$(cat assets/omni.ja.sha256)
          if echo "$ORIG" | grep -qE "^[a-f0-9]{64}[[:space:]]"; then
            echo "$NEW_SHA  omni.ja.xz" > assets/omni.ja.sha256
          else
            echo "$NEW_SHA" > assets/omni.ja.sha256
          fi
          cp omni-new.ja.xz assets/omni.ja.xz
          echo "=== 新 sha256 ==="
          cat assets/omni.ja.sha256

      - name: Replace files in APK
        run: |
          cd staging
          zip -0 ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          cd ..
          echo "=== 验证 ==="
          unzip -l tor-orig.apk | grep omni
          ls -lh tor-orig.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks tor-orig.apk -o signed --allowResign
          ls -lh signed/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FingerprintLess-${{ inputs.tor_version }}
          path: signed/*.apk
