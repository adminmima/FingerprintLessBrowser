- name: Route A - Patch omni.ja prefs
  if: steps.inspect.outputs.route == 'omni'
  run: |
    mkdir -p work && cd work
    # 动态提取实际的 omni.ja 路径
    OMNI_PATH=$(grep -i "omni.ja" ../apk_list.txt | awk '{print $NF}' | head -1)
    echo "Actual omni.ja path in APK: [$OMNI_PATH]"
    if [ -z "$OMNI_PATH" ]; then
      echo "ERROR: omni.ja not found in apk_list.txt"
      exit 1
    fi
    unzip -q ../tor-orig.apk "$OMNI_PATH"
    
    # 找到解压后的实际文件位置
    OMNI_FILE=$(find . -name "omni.ja" -type f | head -1)
    echo "Extracted to: $OMNI_FILE"
    
    OMNI_DIR=$(dirname "$OMNI_FILE")
    cd "$OMNI_DIR"
    mkdir -p omni_extract && cd omni_extract
    unzip -q "../$(basename "$OMNI_FILE")"
    
    echo "=== prefs files found ==="
    find . -name "*.js" -path "*pref*" 2>/dev/null | head -20
    find . -name "prefs.js" 2>/dev/null | head -20
    
    # 搜索并修改
    grep -rl "torlauncher.start_tor" . 2>/dev/null | while read f; do
      echo "Patching start_tor in $f"
      sed -i 's/extensions\.torlauncher\.start_tor.*true/extensions.torlauncher.start_tor", false/' "$f"
    done
    grep -rl "network.proxy.type" . 2>/dev/null | while read f; do
      echo "Patching proxy.type in $f"
      sed -i 's/network\.proxy\.type.*1/network.proxy.type", 0/' "$f"
    done
    
    # 兜底：如果prefs.js存在但没匹配到，追加
    PREFS=$(find . -name "prefs.js" | head -1)
    if [ -n "$PREFS" ]; then
      grep -q "torlauncher.start_tor" "$PREFS" || echo 'pref("extensions.torlauncher.start_tor", false);' >> "$PREFS"
      grep -q "network.proxy.type" "$PREFS" || echo 'pref("network.proxy.type", 0);' >> "$PREFS"
      echo "=== Final prefs.js tail ==="
      tail -5 "$PREFS"
    fi
    
    # 重新打包 omni.ja
    zip -q -r -0 "../omni_new.ja" ./*
    mv "../omni_new.ja" "../omni.ja"
    
    # 回到 work 目录，把新 omni.ja 塞回 APK
    cd ../../..
    # 用相对路径 zip 更新 APK
    cd "$(dirname "$OMNI_FILE")"
    zip -q -0 "../../../tor-orig.apk" "$(basename "$OMNI_PATH")" 2>/dev/null || \
      zip -q -0 "$GITHUB_WORKSPACE/tor-orig.apk" "omni.ja"
    cd "$GITHUB_WORKSPACE"
    ls -lh tor-orig.apk
