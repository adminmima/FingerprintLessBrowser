name: Publish Existing APK to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID containing the artifact'
        required: true
        default: '37583680849'
      artifact_name:
        description: 'Artifact name'
        required: true
        default: 'FingerprintLess-16.0a13'
      tor_version:
        description: 'Version tag'
        required: true
        default: '16.0a13'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact from existing run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk/

      - name: Inspect downloaded files
        run: |
          echo "=== Files ==="
          find apk/ -type f -exec ls -lh {} \;

      - name: Create Release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ inputs.tor_version }}"
          TAG="v${V}-fingerprintless"
          APK=$(find apk/ -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found in artifact"; exit 1
          fi
          echo "Found APK: $APK"
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo ${{ github.repository }}
          else
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "FingerprintLess ${V} (arm64-v8a)" \
              --notes "基于 Tor Browser ${V}，移除 Tor 网络代理，完整保留反指纹保护。" \
              "$APK"
          fi
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
