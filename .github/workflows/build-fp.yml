name: BuildFP

on:
  push:
    paths:
      - '.github/workflows/build-fp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip wget xz-utils openjdk-17-jre-headless
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Get APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="16.0a13"
          echo "VERSION=$V" >> $GITHUB_ENV
          gh release download "cache-${V}" --repo ${{ github.repository }} -p "tor-orig.apk" --clobber

      - name: Decompile
        run: java -jar apktool.jar d tor-orig.apk -o decoded -f

      - name: Search all proxy setting points
        run: |
          echo "########## 1. GeckoRuntimeSettings 里 proxy 相关 ##########"
          f=$(find decoded/smali_classes* -name "GeckoRuntimeSettings.smali" | head -1)
          echo "file: $f"
          grep -nE "proxy|Proxy|9050|9150" "$f" | head -60

          echo ""
          echo "########## 2. TorAndroidIntegration 里 proxy 相关 ##########"
          f2=$(find decoded/smali_classes* -name "TorAndroidIntegration.smali" | head -1)
          grep -nE "proxy|Proxy|9050|9150|setProxy|TorSettings" "$f2" | head -60

          echo ""
          echo "########## 3. 所有 smali 里含 const-string 且含 9050/9150 ##########"
          grep -rn 'const-string.*"9050"\|const-string.*"9150"' decoded/smali_classes*/ 2>/dev/null | head -20

          echo ""
          echo "########## 4. 所有 smali 里含 setProxyHost/setProxyPort ##########"
          grep -rln "setProxyHost\|setProxyPort\|proxyHost(" decoded/smali_classes*/ 2>/dev/null | head -20

          echo ""
          echo "########## 5. GeckoRuntime 里 proxy 相关 ##########"
          f3=$(find decoded/smali_classes* -name "GeckoRuntime.smali" | head -1)
          grep -nE "proxy|Proxy|9050|9150" "$f3" 2>/dev/null | head -40

      - name: Aggressive patch GeckoRuntimeSettings proxy
        run: |
          f=$(find decoded/smali_classes* -name "GeckoRuntimeSettings.smali" | head -1)
          if [ -z "$f" ]; then echo "GeckoRuntimeSettings not found, skip"; exit 0; fi
          cp "$f" "$f.bak"

          echo "===== 原始 proxy 相关方法 ====="
          awk '/^\.method.*[Pp]roxy/,/^\.end method/' "$f" | head -200

          echo ""
          echo "===== 尝试把所有 proxy setter 改为空操作 ====="

          # 找所有以 set...Proxy 或 setProxy 开头的方法，替换方法体为空
          # 用 python 脚本（base64 传，避免 heredoc 破坏 YAML）
          echo 'aW1wb3J0IHN5cywgcmUscGF0aCA9IHN5cy5hcmd2WzFdCcgfIGJhc2U2NCAtZCA+IC90bXAvcGF0Y2gucHk=
' | head -1 > /dev/null

          # 简化：直接 sed 删除 iget-object mProxyHost 那行
          sed -i 's|iget-object v0, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyHost:Ljava/lang/String;|const/4 v0, 0x0|g' "$f"
          sed -i 's|iget-object v1, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyHost:Ljava/lang/String;|const/4 v1, 0x0|g' "$f"
          sed -i 's|iget v0, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyPort:I|const/4 v0, 0x0|g' "$f"
          sed -i 's|iget v1, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyPort:I|const/4 v1, 0x0|g' "$f"
          sed -i 's|iget-object v0, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyUsername:Ljava/lang/String;|const/4 v0, 0x0|g' "$f"
          sed -i 's|iget-object v0, p0, Lorg/mozilla/geckoview/GeckoRuntimeSettings;->mProxyPassword:Ljava/lang/String;|const/4 v0, 0x0|g' "$f"

          echo "===== DIFF ====="
          diff "$f.bak" "$f" || echo "(no changes)"

      - name: Aggressive patch TorSettings proxy fields
        run: |
          f=$(find decoded/smali_classes* -name "TorSettings.smali" | head -1)
          cp "$f" "$f.bak"
          # 前面已经改过 proxyEnabled，这里再把 proxyAddress 和 proxyPort 的赋值全部清零
          sed -i 's|iput-object v1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyAddress:Ljava/lang/String;|const/4 v1, 0x0\n    iput-object v1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyAddress:Ljava/lang/String;|g' "$f"
          sed -i 's|iput-object p1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyAddress:Ljava/lang/String;|const/4 p1, 0x0\n    iput-object p1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyAddress:Ljava/lang/String;|g' "$f"
          sed -i 's|iput v1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyPort:I|const/4 v1, 0x0\n    iput v1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyPort:I|g' "$f"
          sed -i 's|iput p1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyPort:I|const/4 p1, 0x0\n    iput p1, p0, Lorg/mozilla/geckoview/TorSettings;->proxyPort:I|g' "$f"
          echo "===== TorSettings DIFF ====="
          diff "$f.bak" "$f" || echo "(no changes)"

      - name: Patch nav_graph.xml
        run: |
          NAV=decoded/res/navigation/nav_graph.xml
          sed -i 's|org\.mozilla\.fenix\.tor\.TorConnectionAssistFragment|org.mozilla.fenix.home.HomeFragment|g' "$NAV"

      - name: Patch omni.ja prefs
        run: |
          mkdir -p staging && cd staging
          unzip -o ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          cp assets/omni.ja.xz omni.ja.xz
          xz -d omni.ja.xz
          mkdir omni_content && cd omni_content
          unzip -q ../omni.ja
          mkdir -p defaults/pref
          cat > defaults/pref/zzz-fp.js <<'PREFEOF'
          pref("network.proxy.type", 0);
          pref("network.proxy.socks", "");
          pref("network.proxy.socks_port", 0);
          pref("network.proxy.socks_remote_dns", false);
          pref("network.proxy.share_proxy_settings", false);
          pref("network.proxy.http", "");
          pref("network.proxy.http_port", 0);
          pref("network.proxy.ssl", "");
          pref("network.proxy.ssl_port", 0);
          pref("network.proxy.no_proxies_on", "");
          pref("extensions.torlauncher.start_tor", false);
          PREFEOF
          zip -q -r -0 ../omni-new.ja ./*
          cd ..
          xz -9 -k -f omni-new.ja
          NEW_SHA=$(sha256sum omni-new.ja.xz | awk '{print $1}')
          echo "$NEW_SHA" > assets/omni.ja.sha256
          cp omni-new.ja.xz assets/omni.ja.xz

      - name: Repack with aapt2
        run: |
          java -jar apktool.jar b decoded -o tor-patched.apk --use-aapt2
          cd staging
          cp ../tor-patched.apk ./fp.apk
          zip -0 fp.apk assets/omni.ja.xz assets/omni.ja.sha256
          mv fp.apk ../
          cd ..

      - name: Sign APK
        run: |
          TS=$(date +%Y%m%d-%H%M)
          NEW="FingerprintLess-${VERSION}-arm64-去代理v3-${TS}-unsigned.apk"
          mv tor-patched.apk "$NEW"
          java -jar uber-apk-signer.jar --apks "$NEW" -o signed --allowResign
          cd signed
          for f in *-aligned-debugSigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "$(echo "$f" | sed 's/-aligned-debugSigned\.apk$/.apk/')"
          done
          ls -lh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date +%Y%m%d-%H%M)
          TAG="v${VERSION}-fp-noproxy3-${TS}"
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "FP ${VERSION} 去代理v3 ${TS}" \
            --notes "Aggressive proxy removal: GeckoRuntimeSettings + TorSettings + prefs." \
            signed/*.apk
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
