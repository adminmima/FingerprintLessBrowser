name: BuildFP

on:
  push:
    paths:
      - '.github/workflows/build-fp.yml'
      - 'com/fp/tools/FakeSocksServer.java'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip zip wget xz-utils openjdk-17-jdk-headless
          wget -q -O apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          wget -q -O uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          ls -lh *.jar

      - name: Compile FakeSocksServer.java to dex
        run: |
          mkdir -p classes
          javac --release 8 -encoding UTF-8 -d classes com/fp/tools/FakeSocksServer.java
          ls -la classes/com/fp/tools/
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          D8=$(find /usr/local/lib/android/sdk/build-tools /opt/android-sdk/build-tools -name d8 -type f 2>/dev/null | sort | tail -1)
          if [ -z "$D8" ]; then
            echo "d8 not found, listing possible locations"
            ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null
            ls /opt/android-sdk/ 2>/dev/null
            exit 1
          fi
          echo "Using d8: $D8"
          "$D8" --min-api 21 --output . classes/com/fp/tools/*.class
          ls -lh classes.dex

      - name: Get APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="16.0a13"
          echo "VERSION=$V" >> $GITHUB_ENV
          gh release download "cache-${V}" --repo ${{ github.repository }} -p "tor-orig.apk" --clobber

      - name: Decompile APK
        run: java -jar apktool.jar d tor-orig.apk -o decoded -f

      - name: Inject FakeSocks start into HomeActivity
        run: |
          f=decoded/smali_classes2/org/mozilla/fenix/HomeActivity.smali
          awk '
            BEGIN { done=0; is_onc=0 }
            /^\.method public final onCreate\(Landroid\/os\/Bundle;\)V/ { is_onc=1; print; next }
            is_onc && !done && /^[[:space:]]*\.locals/ {
              print
              print ""
              print "    invoke-static {}, Lcom/fp/tools/FakeSocksServer;->start()V"
              done=1; is_onc=0; next
            }
            { print }
          ' "$f" > "$f.new"
          mv "$f.new" "$f"
          echo "=== 注入结果 ==="
          grep -n -B 2 -A 2 "FakeSocksServer" "$f"
          if ! grep -q "FakeSocksServer" "$f"; then
            echo "ERROR: 注入失败"
            exit 1
          fi

      - name: Patch nav_graph.xml
        run: |
          NAV=decoded/res/navigation/nav_graph.xml
          sed -i 's|org\.mozilla\.fenix\.tor\.TorConnectionAssistFragment|org.mozilla.fenix.home.HomeFragment|g' "$NAV"

      - name: Patch omni.ja prefs
        run: |
          mkdir -p staging && cd staging
          unzip -o ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          cp assets/omni.ja.xz omni.ja.xz
          xz -d omni.ja.xz
          mkdir omni_content && cd omni_content
          unzip -q ../omni.ja
          mkdir -p defaults/pref
          cat > defaults/pref/zzz-fp.js <<'PREFEOF'
          pref("network.proxy.type", 1);
          pref("network.proxy.socks", "127.0.0.1");
          pref("network.proxy.socks_port", 9050);
          pref("network.proxy.socks_remote_dns", true);
          PREFEOF
          zip -q -r -0 ../omni-new.ja ./*
          cd ..
          xz -9 -k -f omni-new.ja
          NEW_SHA=$(sha256sum omni-new.ja.xz | awk '{print $1}')
          echo "$NEW_SHA" > assets/omni.ja.sha256
          cp omni-new.ja.xz assets/omni.ja.xz

      - name: Repack APK
        run: |
          java -jar apktool.jar b decoded -o tor-patched.apk --use-aapt2
          cd staging
          cp ../tor-patched.apk ./fp.apk
          zip -0 fp.apk assets/omni.ja.xz assets/omni.ja.sha256
          mv fp.apk ../
          cd ..

      - name: Inject classes.dex as classes4.dex
        run: |
          # 复制到 apk 目录，重命名为 classes4.dex（避免与已有 classes.dex 冲突）
          mkdir -p inject_work && cd inject_work
          cp ../tor-patched.apk ./base.apk
          cp ../classes.dex ./classes4.dex
          # 用 zip 添加（APK 就是 zip）
          zip -0 base.apk classes4.dex
          # 验证
          unzip -l base.apk | grep "classes.*dex"
          mv base.apk ../tor-final.apk
          cd ..
          ls -lh tor-final.apk

      - name: Sign APK
        run: |
          TS=$(date +%Y%m%d-%H%M)
          NEW="FingerprintLess-${VERSION}-arm64-假代理-${TS}-unsigned.apk"
          mv tor-final.apk "$NEW"
          java -jar uber-apk-signer.jar --apks "$NEW" -o signed --allowResign
          cd signed
          for f in *-aligned-debugSigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "$(echo "$f" | sed 's/-aligned-debugSigned\.apk$/.apk/')"
          done
          ls -lh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date +%Y%m%d-%H%M)
          TAG="v${VERSION}-fp-fakesocks-${TS}"
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "FP ${VERSION} 假代理版 ${TS}" \
            --notes "Embedded SOCKS5 on 127.0.0.1:9050, direct connection." \
            signed/*.apk
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
