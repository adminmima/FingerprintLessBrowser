name: BuildFP

on:
  push:
    paths:
      - '.github/workflows/build-fp.yml'
      - 'com/fp/tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip zip wget xz-utils openjdk-17-jdk-headless
          wget -q -O apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          wget -q -O uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          wget -q -O baksmali.jar "https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar"
          ls -lh *.jar

      - name: Compile Java to dex then to smali
        run: |
          mkdir -p classes
          ANDROID_JAR=$(find /usr/local/lib/android/sdk/platforms -name android.jar 2>/dev/null | sort | tail -1)
          echo "ANDROID_JAR=$ANDROID_JAR"
          ls -lh "$ANDROID_JAR" || true
          if [ -z "$ANDROID_JAR" ]; then
            echo "ERROR: android.jar not found"
            ls /usr/local/lib/android/sdk/platforms/ 2>/dev/null
            exit 1
          fi
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -encoding UTF-8 -d classes \
            com/fp/tools/FakeSocksServer.java \
            com/fp/tools/FakeSocksProvider.java
          ls -la classes/com/fp/tools/
          D8=$(find /usr/local/lib/android/sdk/build-tools -name d8 -type f 2>/dev/null | sort | tail -1)
          echo "Using d8: $D8"
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output . classes/com/fp/tools/*.class
          ls -lh classes.dex
          mkdir -p smali_out
          java -jar baksmali.jar d classes.dex -o smali_out/
          find smali_out -name "FakeSocks*.smali"
          ls smali_out/com/fp/tools/

      - name: Get APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="16.0a13"
          echo "VERSION=$V" >> $GITHUB_ENV
          gh release download "cache-${V}" --repo ${{ github.repository }} -p "tor-orig.apk" --clobber

      - name: Decompile APK
        run: java -jar apktool.jar d tor-orig.apk -o decoded -f

      - name: Inject FakeSocks smali into smali_classes3
        run: |
          mkdir -p decoded/smali_classes3/com/fp
          cp -r smali_out/com/fp/tools decoded/smali_classes3/com/fp/
          find decoded/smali_classes3/com/fp -name "*.smali"

      - name: Patch AndroidManifest.xml to add ContentProvider
        run: |
          MANIFEST=decoded/AndroidManifest.xml
          cp "$MANIFEST" "$MANIFEST.bak"
          # 在 </application> 前插入 provider 声明
          awk '
            /<\/application>/ {
              print "        <provider android:name=\"com.fp.tools.FakeSocksProvider\" android:authorities=\"com.fp.tools.fakesocks\" android:exported=\"false\" />"
            }
            { print }
          ' "$MANIFEST.bak" > "$MANIFEST"
          echo "=== provider 声明 ==="
          grep -A 1 "FakeSocksProvider" "$MANIFEST"
          if ! grep -q "FakeSocksProvider" "$MANIFEST"; then
            echo "ERROR: 未插入 provider"
            exit 1
          fi

      - name: Patch nav_graph.xml
        run: |
          NAV=decoded/res/navigation/nav_graph.xml
          sed -i 's|org\.mozilla\.fenix\.tor\.TorConnectionAssistFragment|org.mozilla.fenix.home.HomeFragment|g' "$NAV"

      - name: Patch omni.ja prefs
        run: |
          mkdir -p staging && cd staging
          unzip -o ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          cp assets/omni.ja.xz omni.ja.xz
          xz -d omni.ja.xz
          mkdir omni_content && cd omni_content
          unzip -q ../omni.ja
          mkdir -p defaults/pref
          cat > defaults/pref/zzz-fp.js <<'PREFEOF'
          pref("network.proxy.type", 1);
          pref("network.proxy.socks", "127.0.0.1");
          pref("network.proxy.socks_port", 9050);
          pref("network.proxy.socks_remote_dns", true);
          PREFEOF
          zip -q -r -0 ../omni-new.ja ./*
          cd ..
          xz -9 -k -f omni-new.ja
          NEW_SHA=$(sha256sum omni-new.ja.xz | awk '{print $1}')
          echo "$NEW_SHA" > assets/omni.ja.sha256
          cp omni-new.ja.xz assets/omni.ja.xz

      - name: Repack APK
        run: |
          java -jar apktool.jar b decoded -o tor-final.apk --use-aapt2
          ls -lh tor-final.apk
          unzip -l tor-final.apk | grep -E "classes[0-9]*\.dex"

      - name: Inject omni.ja files
        run: |
          cd staging
          cp ../tor-final.apk ./fp.apk
          zip -0 fp.apk assets/omni.ja.xz assets/omni.ja.sha256
          mv fp.apk ../
          cd ..
          mv fp.apk tor-final.apk 2>/dev/null || true
          ls -lh tor-final.apk
          # 验证 provider 类在哪个 dex
          unzip -l tor-final.apk | grep "classes"

      - name: Sign APK
        run: |
          TS=$(date +%Y%m%d-%H%M)
          NEW="FingerprintLess-${VERSION}-arm64-假代理v3-${TS}-unsigned.apk"
          mv tor-final.apk "$NEW"
          java -jar uber-apk-signer.jar --apks "$NEW" -o signed --allowResign
          cd signed
          for f in *-aligned-debugSigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "$(echo "$f" | sed 's/-aligned-debugSigned\.apk$/.apk/')"
          done
          ls -lh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date +%Y%m%d-%H%M)
          TAG="v${VERSION}-fp-fakesocks-v3-${TS}"
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "FP ${VERSION} 假代理 v3 ${TS}" \
            --notes "ContentProvider auto-start. 100% guaranteed early init." \
            signed/*.apk
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
