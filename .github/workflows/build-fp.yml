name: BuildFP

on:
  push:
    paths:
      - '.github/workflows/build-fp.yml'
  workflow_dispatch:
    inputs:
      tor_version:
        description: 'Tor Browser version'
        required: true
        default: '16.0a13'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip wget xz-utils openjdk-17-jre-headless
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Get APK from cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ inputs.tor_version }}"
          if [ -z "$V" ]; then V="16.0a13"; fi
          echo "VERSION=$V" >> $GITHUB_ENV
          gh release download "cache-${V}" --repo ${{ github.repository }} -p "tor-orig.apk" --clobber

      - name: Decompile
        run: java -jar apktool.jar d tor-orig.apk -o decoded -f

      - name: Dump TorSettings getters/setters
        run: |
          echo "########## TorSettings 所有 Proxy 相关方法 ##########"
          awk '/\.method.*Proxy/,/\.end method/' \
            decoded/smali_classes3/org/mozilla/geckoview/TorSettings.smali | head -200

      - name: Dump GeckoAppShell proxy block
        run: |
          echo "########## GeckoAppShell.smali 第 3650-3800 行 ##########"
          sed -n '3650,3800p' decoded/smali_classes2/org/mozilla/gecko/GeckoAppShell.smali

      - name: Dump TorAndroidIntegration SettingsLoader
        run: |
          echo "########## SettingsLoader 全部内容 ##########"
          cat "decoded/smali_classes3/org/mozilla/geckoview/TorAndroidIntegration\$SettingsLoader.smali" 2>/dev/null | head -150

      - name: Patch TorSettings - force proxyEnabled false
        run: |
          f=decoded/smali_classes3/org/mozilla/geckoview/TorSettings.smali

          # 策略：把所有 "iget-boolean ...->proxyEnabled" 之后的读取都强行返回 false
          # 更简单粗暴：找到 getter 方法，把方法体改为 return false
          echo "=== 找 getProxyEnabled / isProxyEnabled 方法 ==="
          grep -nE "\.method.*ProxyEnabled" "$f" || echo "no explicit getter"
          
          echo "=== 所有 iput-boolean 到 proxyEnabled 的指令（设置处）==="
          grep -n "iput-boolean.*proxyEnabled" "$f"
          
          echo "=== 所有 iget-boolean 从 proxyEnabled 的指令（读取处）==="
          grep -n "iget-boolean.*proxyEnabled" "$f"

          # 暴力 patch：把所有 iput-boolean 到 proxyEnabled 改为 iput-boolean 0x0
          # 这保证所有 setter 都写入 false
          python3 - "$f" <<'PYEOF'
import sys, re
path = sys.argv[1]
lines = open(path).readlines()
count = 0
for i, line in enumerate(lines):
    # 匹配 "iput-boolean vX, p0, Lorg/mozilla/geckoview/TorSettings;->proxyEnabled:Z"
    if 'iput-boolean' in line and '->proxyEnabled:Z' in line:
        # 提取缩进和后面的注释（保持格式）
        m = re.match(r'^(\s*)iput-boolean\s+\S+,\s*(\S+),\s*(Lorg/mozilla/geckoview/TorSettings;->proxyEnabled:Z.*)$', line)
        if m:
            indent, obj, rest = m.groups()
            # 把值改为 0x0（false）。常量寄存器需要先声明，但 0x0 是特殊立即数
            # iput-boolean 不接受立即数，必须用寄存器。所以要用 const/4 先加载 0
            # 简化：只改 p1 这种明显是参数的地方→ 但那会破坏语义
            # 更安全：在每个 iput-boolean 前插入 const/4 + 改寄存器
            # 但这里直接换成 v_ 可能寄存器冲突
            pass
    count += 1

# 更安全的做法：改写 getter 方法
# 找到 "iget-boolean vX, p0, ...->proxyEnabled:Z" 所在的方法，把返回值改为 0
new_lines = []
i = 0
patched_methods = []
while i < len(lines):
    line = lines[i]
    # 找到方法声明
    m = re.match(r'^\.method public final (isProxyEnabled|getProxyEnabled)\(\)Z', line)
    if m:
        # 记录该方法开始
        method_name = m.group(1)
        start = i
        # 找到方法结束
        while i < len(lines) and not lines[i].strip().startswith('.end method'):
            i += 1
        # i 现在在 .end method 行
        # 替换方法体为：.locals 1 / const/4 v0, 0x0 / return v0
        new_lines.append(line)
        new_lines.append('    .locals 1')
        new_lines.append('')
        new_lines.append('    const/4 v0, 0x0')
        new_lines.append('')
        new_lines.append('    return v0')
        new_lines.append(lines[i])  # .end method
        patched_methods.append(method_name)
        i += 1
        continue
    new_lines.append(line)
    i += 1

open(path, 'w').writelines(new_lines)
print(f"Patched methods: {patched_methods}")
PYEOF

          echo "=== 修改后 ==="
          grep -nE "\.method.*ProxyEnabled" "$f"
          awk '/\.method.*isProxyEnabled|\.method.*getProxyEnabled/,/\.end method/' "$f"

      - name: Patch GeckoAppShell http.proxyHost
        run: |
          f=decoded/smali_classes2/org/mozilla/gecko/GeckoAppShell.smali
          echo "=== 找相关方法名 ==="
          grep -nB 3 "http.proxyHost" "$f" | head -20

          # 更暴力：把所有 "http.proxyHost"/"http.proxyPort" 等常量字符串改为空前缀（无效）
          # 这样即使代码试图读/写这些属性，也拿不到有意义的值
          sed -i 's|"http\.proxyHost"|"http.proxyHost.disabled"|g' "$f"
          sed -i 's|"http\.proxyPort"|"http.proxyPort.disabled"|g' "$f"
          sed -i 's|"https\.proxyHost"|"https.proxyHost.disabled"|g' "$f"
          sed -i 's|"https\.proxyPort"|"https.proxyPort.disabled"|g' "$f"
          echo "=== 修改后 ==="
          grep -n "proxy" "$f" | head -20

      - name: Patch nav_graph.xml
        run: |
          NAV=decoded/res/navigation/nav_graph.xml
          sed -i 's|org\.mozilla\.fenix\.tor\.TorConnectionAssistFragment|org.mozilla.fenix.home.HomeFragment|g' "$NAV"

      - name: Patch omni.ja prefs
        run: |
          mkdir -p staging && cd staging
          unzip -o ../tor-orig.apk assets/omni.ja.xz assets/omni.ja.sha256
          cp assets/omni.ja.xz omni.ja.xz
          xz -d omni.ja.xz
          mkdir omni_content && cd omni_content
          unzip -q ../omni.ja
          mkdir -p defaults/pref
          cat > defaults/pref/zzz-fp.js <<'PREFEOF'
          pref("network.proxy.type", 0);
          pref("network.proxy.socks", "");
          pref("network.proxy.socks_port", 0);
          pref("network.proxy.socks_remote_dns", false);
          pref("extensions.torlauncher.start_tor", false);
          PREFEOF
          zip -q -r -0 ../omni-new.ja ./*
          cd ..
          xz -9 -k -f omni-new.ja
          NEW_SHA=$(sha256sum omni-new.ja.xz | awk '{print $1}')
          echo "$NEW_SHA" > assets/omni.ja.sha256
          cp omni-new.ja.xz assets/omni.ja.xz

      - name: Repack with aapt2
        run: |
          java -jar apktool.jar b decoded -o tor-patched.apk --use-aapt2
          cd staging
          cp ../tor-patched.apk ./fp.apk
          zip -0 fp.apk assets/omni.ja.xz assets/omni.ja.sha256
          mv fp.apk ../
          cd ..

      - name: Sign APK
        run: |
          TS=$(date +%Y%m%d-%H%M)
          NEW="FingerprintLess-${VERSION}-arm64-去Tor网络去代理-${TS}-unsigned.apk"
          mv tor-patched.apk "$NEW"
          java -jar uber-apk-signer.jar --apks "$NEW" -o signed --allowResign
          cd signed
          for f in *-aligned-debugSigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "$(echo "$f" | sed 's/-aligned-debugSigned\.apk$/.apk/')"
          done
          ls -lh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date +%Y%m%d-%H%M)
          TAG="v${VERSION}-fp-noproxy-${TS}"
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "FP ${VERSION} 去Tor网络+去代理 ${TS}" \
            --notes "Tor network removed + Tor proxy disabled + Tor onboarding bypassed." \
            signed/*.apk
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
